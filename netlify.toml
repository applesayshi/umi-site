# Netlify deploy settings. See README.md › "Going live".

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# ── Redirects from the old Squarespace site, so shared links keep working ────
[[redirects]]
  from = "/upcoming-events"
  to = "/events/"
  status = 301

[[redirects]]
  from = "/pastevents"
  to = "/events/#past"
  status = 301

[[redirects]]
  from = "/events-1"
  to = "/events/"
  status = 301

[[redirects]]
  from = "/events-1/*"
  to = "/events/"
  status = 301

[[redirects]]
  from = "/joinus"
  to = "/join/"
  status = 301

[[redirects]]
  from = "/lessons-1"
  to = "/lessons/"
  status = 301

[[redirects]]
  from = "/booking-rentals"
  to = "/booking/"
  status = 301

[[redirects]]
  from = "/sponsorships"
  to = "/sponsors/"
  status = 301

# Featured artists became ProduceUMI.
[[redirects]]
  from = "/artists"
  to = "/produceumi/"
  status = 301

[[redirects]]
  from = "/artists/*"
  to = "/produceumi/"
  status = 301

# ── Headers ─────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"

# Fingerprinted build assets never change, so cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Original uploads exist only for CMS thumbnails; keep them out of search results.
[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/calendar.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/events/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-cache"
