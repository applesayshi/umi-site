# Rebuilds the site on demand (GitHub → Actions → Rebuild the site → Run workflow).
#
# It deliberately has no schedule: every successful Netlify production deploy uses credits (15 of the
# free plan's 300 a month), so a daily rebuild would use up the month's credits and get the site paused.
# The upcoming lists and "Past shows" already correct themselves in visitors' browsers between deploys.
#
# Setup (one time):
#   1. Netlify: Project configuration → Build & deploy → Build hooks → Add build hook.
#   2. GitHub repo: Settings → Secrets and variables → Actions → New secret
#      named NETLIFY_BUILD_HOOK containing the hook URL.

name: Rebuild the site

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK secret is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
